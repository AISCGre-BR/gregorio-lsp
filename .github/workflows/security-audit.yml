name: Security Audit

on:
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/security-audit.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/security-audit.yml"
  schedule:
    # Daily check against the RustSec advisory database (06:30 UTC), so newly
    # published advisories are caught even when dependencies do not change.
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo-deny (${{ matrix.checks }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checks:
          - advisories
          - bans licenses sources
    # New advisories must not block unrelated PRs: they are reported by the
    # scheduled run instead.
    continue-on-error: ${{ matrix.checks == 'advisories' && github.event_name == 'pull_request' }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}
