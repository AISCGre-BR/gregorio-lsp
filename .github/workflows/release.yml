name: Release binaries

# Builds prebuilt gregorio-lsp / grelint / grefmt binaries and attaches them to
# the GitHub Release of the tag. Editor integrations (e.g. zed-gregorio)
# download these assets so users do not need a Rust toolchain.
#
# Asset naming contract (relied upon by zed-gregorio, do not change lightly):
#   gregorio-lsp-<rust-target>.tar.gz   (Linux, macOS)
#   gregorio-lsp-<rust-target>.zip      (Windows)
# Each archive holds the gregorio-lsp, grelint and grefmt executables at its
# root, plus LICENSE and README.md.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach binaries to (e.g. v0.13.0)"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        shell: bash
        run: |
          cargo build --release --locked --target "${{ matrix.target }}" \
            -p gregorio-server -p gregorio-cli

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          name="gregorio-lsp-${{ matrix.target }}"
          bin_dir="target/${{ matrix.target }}/release"
          stage="$(mktemp -d)"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            ext=".exe"
          else
            ext=""
          fi
          for bin in gregorio-lsp grelint grefmt; do
            cp "$bin_dir/$bin$ext" "$stage/"
          done
          cp LICENSE README.md "$stage/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            archive="$name.zip"
            (cd "$stage" && 7z a -tzip "$GITHUB_WORKSPACE/$archive" ./*)
          else
            archive="$name.tar.gz"
            tar -C "$stage" -czf "$archive" .
          fi
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.archive }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

  release:
    name: Attach to GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum gregorio-lsp-* > SHA256SUMS

      - name: Upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          fi
          gh release upload "$TAG" dist/* --clobber
