name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          # Fail on known vulnerabilities of moderate severity or higher
          # introduced by the pull request (Cargo.lock and workflow actions).
          fail-on-severity: moderate
          # Keep in sync with [licenses].allow in deny.toml.
          allow-licenses: MIT, Apache-2.0, Unicode-3.0, Unlicense
          comment-summary-in-pr: on-failure
